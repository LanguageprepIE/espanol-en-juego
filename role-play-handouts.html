<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Role Play Handouts · Español en juego</title><style>
*{box-sizing:border-box}body{margin:0;background:#0a1630;color:#f5f2ea;font:18px system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:20px}a{color:#ffca58}button,select{font:inherit;padding:10px;border-radius:8px;border:1px solid #587090;background:#192c4d;color:#fff;cursor:pointer}button.primary{background:#ffca58;color:#0a1630;font-weight:bold}.toolbar{position:sticky;top:0;background:#0a1630;z-index:2;padding:10px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}article{background:#fff;color:#172b43;padding:30px 38px;margin:16px 0;border-radius:12px;line-height:1.4}h1{font-size:30px;margin:7px 0}h2{font-size:23px;margin:12px 0;color:#214b70}h3{font-size:18px;margin:12px 0 5px}p{margin:7px 0}ol{padding-left:25px;margin:6px 0}li{margin:6px 0}.vocab{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.bank{padding:8px;background:#edf3f7;border-radius:5px}.line{height:27px;border-bottom:1px solid #9aa9b7}.model{font-size:19px;font-weight:650;line-height:1.65}.eyebrow{font-size:12px;letter-spacing:.08em;font-weight:700;color:#42657f}.footer{font-size:12px;border-top:1px solid #c7d0d8;margin-top:18px;padding-top:6px}body.project article{font-size:clamp(19px,2.2vw,28px);max-width:1250px;margin:10px auto;padding:20px 35px}body.project main{max-width:1450px}body.project h1{font-size:clamp(28px,3vw,40px)}body.project h2{font-size:clamp(25px,2.8vw,35px)}body.project h3,body.project .model{font-size:inherit}body.project .line{height:20px}body.project .writing-lines{display:none}body.project .page:not(.active){display:none}body.project .footer{display:none}@media(max-width:650px){article{padding:18px}.vocab{grid-template-columns:1fr 1fr}}@page{size:A4;margin:14mm}@media print{body{background:white;color:#172b43;font:11pt Arial,sans-serif}main{padding:0;max-width:none}.toolbar,.screen-only{display:none!important}article,body.project article{display:block!important;margin:0;padding:0;border-radius:0;break-after:page;page-break-after:always;font-size:11pt}article:last-child{break-after:auto;page-break-after:auto}body.project .writing-lines{display:block}body.project .footer{display:block}h1,body.project h1{font-size:21pt}h2,body.project h2{font-size:15pt}h3,body.project h3{font-size:12pt}.model,body.project .model{font-size:12pt}.line,body.project .line{height:22px}.turn{break-inside:avoid}.bank{background:#edf3f7;print-color-adjust:exact}}
</style></head><body><main><div class="toolbar"><a href="role-play-challenge.html" id="back">← Role Play Challenge</a><select id="role" aria-label="Choose role play"></select><button id="project" class="primary">Project / Proyectar</button><button id="prev" hidden>← Previous</button><span id="counter" hidden></span><button id="next" hidden>Next →</button><button id="print">Print / Save PDF</button><button id="download">Download handout</button></div><div id="pages"></div></main><script>
const data=[{"title":"Alojamiento","turns":[["Hola, ¡dígame!",["El próximo curso estaré de Erasmus en la Universidad de Extremadura en Cáceres.","No conozco a nadie allí.","¿Me puede aconsejar sobre el alojamiento?"]],["¿En qué parte de la ciudad querrías vivir?",["Preferiría vivir cerca de la universidad.","El año pasado vivía en las afueras de Dublín","y no me gustó nada."]],["¿Por qué?",["Pasaba mucho tiempo en el transporte","porque estaba lejos de todo.","Si pudiera usar ese tiempo para estudiar,","podría sacar buenas notas."]],["Tienes razón. Pero sabes que Cáceres es una ciudad muy pequeña y se puede andar desde las afueras a la Plaza Mayor en media hora.",["Ah, media hora no está lejos.","Además, hace mejor tiempo que en Irlanda.","Consideraré todos los barrios,","aunque preferiría vivir en el centro."]]],"surprise":"¿Quieres compartir piso?","closing":"","context":"You are going to study in Cáceres and ask for advice about accommodation.","quiz":["Where will the student study? Cáceres / Madrid / Barcelona","What does the student need? accommodation / a car / a laptop","Where would the student prefer to live? near university / at the airport / by the sea","What was the problem in Dublin? transport / food / exams","How long is the walk to Plaza Mayor? 10 / 30 / 60 minutes"],"vocab":[["el alojamiento","accommodation"],["las afueras","outskirts"],["cerca de","near"],["el curso","academic year"],["el transporte","transport"],["las notas","grades"],["el barrio","neighbourhood"],["el centro","centre"],["la universidad","university"]],"listen":[["El próximo curso","next academic year"],["No conozco a nadie","I know nobody"],["Preferiría vivir","I would prefer to live"],["Las afueras","outskirts"],["Media hora","half an hour"],["Hace mejor tiempo","the weather is better"]],"cues":["Say you will be on Erasmus in Cáceres at the University of Extremadura, know nobody there and ask for accommodation advice.","Say you would prefer to live near university; last year you lived on the outskirts of Dublin and did not like it.","Explain you spent much time travelling because you lived far away; if you could study instead, you could get good grades.","Say half an hour is not far, the weather is better than Ireland, and you will consider all neighbourhoods but prefer the centre."],"gaps":[["Erasmus","Cáceres","nadie","alojamiento"],["cerca","universidad","afueras","gustó"],["transporte","lejos","estudiar","notas"],["media hora","tiempo","barrios","centro"]]},{"title":"El portátil roto","turns":[["¡Hola! ¿En qué puedo ayudarte?",["Hola. Se me cayó el portátil","y la pantalla está rota.","Lo peor es que debo entregar una redacción mañana","y la única copia está en el ordenador."]],["Vamos a ver. ¿Qué te pasó?",["Llegaba tarde y corrí para coger el autobús.","Resbalé y el portátil se cayó al suelo.","Solo vi el daño cuando me levanté."]],["Vas a necesitar una nueva pantalla que cuesta doscientos euros.",["Me alegro de que se pueda reparar,","pero he visto la misma marca y modelo","en el escaparate por solo trescientos euros."]],["Sí, hay una oferta especial esta semana. ¿Quieres comprarlo?",["Lo compraré si puede pasar todos mis archivos","al disco duro nuevo antes de que me vaya","y si me regala una bolsa para el portátil."]]],"surprise":"¿Para qué necesitas el portátil?","closing":"Por supuesto.","context":"You are in Ávila. Your laptop is broken and you visit a computer repair shop.","quiz":["Where is the conversation? a hotel / a repair shop / a restaurant","What is broken? a phone / a laptop / a car","When is the essay due? today / tomorrow / next week","How much is the new screen? €100 / €200 / €300","How much is the laptop in the window? €200 / €300 / €400"],"vocab":[["el portátil","laptop"],["la pantalla","screen"],["rota","broken"],["una redacción","essay"],["el autobús","bus"],["el suelo","floor"],["el escaparate","shop window"],["los archivos","files"],["una bolsa","bag"]],"listen":[["Se me cayó","I dropped it"],["Resbalé","I slipped"],["La única copia","the only copy"],["La misma marca y modelo","same make and model"],["El disco duro","hard drive"],["Gratis","free"]],"cues":["Say your laptop fell and the screen is broken. Say the worst thing is that your essay is due tomorrow and the only copy is on the laptop.","Say you were late and had to run to catch the bus. Say you slipped, the laptop fell on the ground and you only noticed the problem when you got up.","Say it is good that it can be fixed, but you saw the same make and model in the shop window for only €300.","Say you will buy it if they copy all your files to the new hard drive before you leave the shop and give you a free laptop bag."],"gaps":[["portátil","rota","redacción","mañana","copia"],["tarde","autobús","Resbalé","suelo","levanté"],["reparar","marca","modelo","escaparate","trescientos"],["compraré","archivos","disco duro","vaya","regala","bolsa"]]},{"title":"Una autocaravana/cámper","turns":[["¡Hola! ¿En qué puedo ayudarte?",["Hola. Soy estudiante y llamo desde Irlanda.","Quiero alquilar una autocaravana","durante dos semanas en julio."]],["Para alquilar una autocaravana hace falta tener al menos veinticinco años y mucha experiencia al volante.",["Mi madre conducirá porque todavía no tengo carné.","Ahora estoy dando clases de conducir","y espero aprobar en otoño."]],["Pues, muy bien. Tu madre cumple con los requisitos para alquilar una autocaravana.",["Mi madre lleva veinte años conduciendo por la derecha","en varios países de Europa.","Conduce con mucho cuidado","y nunca ha tenido un accidente."]],["¡Fenomenal! Os alquilo una autocaravana. ¿Tenéis el itinerario previsto?",["Hemos pasado mucho tiempo en la costa,","pero este verano queremos viajar por Castilla-La Mancha","para conocer la tierra de Cervantes y Don Quijote,","lejos de los turistas."]]],"surprise":"¿Cuántas personas vais a viajar?","closing":"","context":"You call from Ireland to rent a camper van in Spain.","quiz":["What does the student want to rent? a camper van / a bicycle / a room","For how long? two days / two weeks / two months","Who will drive? the student / the mother / the father","How many years has she driven? 5 / 10 / 20","Where do they want to travel? Castilla-La Mancha / Galicia / the coast"],"vocab":[["la autocaravana","camper van"],["alquilar","to rent"],["el carné","driving licence"],["las clases de conducir","driving lessons"],["aprobar","to pass"],["al volante","behind the wheel"],["el accidente","accident"],["la costa","coast"],["lejos de","far from"]],"listen":[["Dos semanas","two weeks"],["Mi madre conducirá","my mother will drive"],["Espero aprobar","I hope to pass"],["Veinte años","twenty years"],["Con mucho cuidado","very carefully"],["Lejos de los turistas","away from tourists"]],"cues":["Say you are a student calling from Ireland and want to rent a camper van for two weeks in July.","Say your mother will drive because you have no licence yet, you are taking driving lessons and hope to pass in autumn.","Say she has driven on the right in several European countries for twenty years, drives carefully and has never had an accident.","Say you have spent much time on the coast but want to travel around Castilla-La Mancha this summer to discover Cervantes and Don Quixote's homeland away from tourists."],"gaps":[["estudiante","Irlanda","autocaravana","julio"],["conducirá","carné","clases","otoño"],["veinte","derecha","Europa","cuidado","accidente"],["costa","verano","Castilla-La Mancha","turistas"]]},{"title":"El medioambiente","turns":[["Pareces muy contento, ¿por qué?",["El Parlamento Europeo ha acordado prohibir","los plásticos de usar y tirar,","por ejemplo, cuchillos, tenedores, cucharas,","vasos, platos y pajitas."]],["¿Es importante prohibir plásticos de usar y tirar?",["Sí, es absolutamente esencial.","Será muy bueno para las aguas del planeta.","La contaminación causada por los plásticos","es un problema grave en los ríos, lagos y océanos."]],["¿Podemos hacer algo más?",["Hay muchas cosas que podemos hacer.","Por ejemplo, en vez de plástico podemos usar","papel reciclado, cartón y otros materiales biodegradables."]],["Y, ¿ya está?",["No, como ciudadanos tenemos que ser más responsables","y cambiar nuestro estilo de vida.","Para proteger el medioambiente, podríamos ir en bicicleta,","viajar en transporte público o caminar más."]]],"surprise":"¿Qué haces tú para proteger el medioambiente?","closing":"","context":"You discuss the environment and the ban on single-use plastics.","quiz":["What is the topic? plastic / holidays / sport","Which institution agreed to the ban? European Parliament / school / local shop","Which item is mentioned? straws / shoes / laptops","Which material is an alternative? cardboard / metal cans only / glass only","Which transport is suggested? bicycle / helicopter / taxi"],"vocab":[["prohibir","to ban"],["de usar y tirar","single-use"],["las pajitas","straws"],["la contaminación","pollution"],["los océanos","oceans"],["el cartón","cardboard"],["reciclado","recycled"],["el medioambiente","environment"],["el transporte público","public transport"]],"listen":[["El Parlamento Europeo","European Parliament"],["De usar y tirar","single-use"],["La contaminación","pollution"],["Papel reciclado","recycled paper"],["Más responsables","more responsible"],["Ir en bicicleta","to cycle"]],"cues":["Say the European Parliament has agreed to ban single-use plastics and give examples of cutlery, cups, plates and straws.","Say the ban is essential and good for the planet's waters; plastic pollution is serious in rivers, lakes and oceans.","Say there are many things we can do, for example using recycled paper, cardboard and biodegradable materials instead of plastic.","Say citizens must be more responsible and change their lifestyle; suggest cycling, public transport and walking more."],"gaps":[["Europeo","prohibir","plásticos","pajitas"],["esencial","aguas","contaminación","océanos"],["cosas","plástico","reciclado","biodegradables"],["responsables","estilo de vida","bicicleta","transporte público"]]},{"title":"Avería de coche","turns":[["Hola, buenas tardes.",["Mi coche se acaba de averiar","y estoy en la autopista AP-6.","No sé exactamente dónde estoy,","pero pasé por el peaje hace media hora."]],["Debes estar entre Medina del Campo y Tordesillas. ¿Hay alguna señal de tráfico por ahí?",["Veo la señal de la salida 156 a lo lejos.","¿Podría enviar un mecánico o quizás una grúa?","Creo que el problema es grave."]],["Claro que sí. Voy a arreglarlo todo inmediatamente.",["¿Podría darme un coche de sustitución","para continuar mi viaje a Lugo?","Tengo que recoger a mis padres","en el aeropuerto de Santiago de Compostela."]],["Por supuesto. ¿Me puedes describir tu coche?",["Es un SEAT Ibiza rojo.","La matrícula es 4620 CFK.","Lo compré de segunda mano a mi tía","y nunca he tenido problemas con él."]]],"surprise":"¿Desde dónde viajas?","closing":"","context":"Your car breaks down on a Spanish motorway and you call for help.","quiz":["What has broken down? a car / a laptop / a bus","Which motorway? AP-6 / AP-7 / M-30","How long ago did you pass the toll? half an hour / two hours / five minutes","What exit can you see? 156 / 165 / 516","Who must you collect? parents / friends / students"],"vocab":[["averiarse","to break down"],["la autopista","motorway"],["el peaje","toll"],["la salida","exit"],["la grúa","tow truck"],["el mecánico","mechanic"],["el coche de sustitución","replacement car"],["la matrícula","registration plate"],["de segunda mano","second-hand"]],"listen":[["Se acaba de averiar","has just broken down"],["Hace media hora","half an hour ago"],["A lo lejos","in the distance"],["Una grúa","a tow truck"],["Coche de sustitución","replacement car"],["De segunda mano","second-hand"]],"cues":["Say your car has just broken down on the AP-6; you do not know exactly where you are but passed a toll half an hour ago.","Say you see exit 156 in the distance; ask for a mechanic or tow truck because you think the problem is serious.","Ask for a replacement car to continue to Lugo; you must collect your parents at Santiago de Compostela airport.","Describe your red SEAT Ibiza, registration 4620 CFK; say you bought it second-hand from your aunt and never had problems with it."],"gaps":[["averiar","autopista","exactamente","peaje"],["salida","156","mecánico","grúa","grave"],["sustitución","Lugo","padres","aeropuerto"],["rojo","matrícula","segunda mano","tía","problemas"]]}];const $=id=>document.getElementById(id);let current=0;let idx=Number(new URLSearchParams(location.search).get('role')||1);if(!Number.isInteger(idx)||idx<0||idx>=data.length)idx=1;let projection=new URLSearchParams(location.search).get('view')==='project';const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');const lines=n=>'<div class="writing-lines">'+ '<div class="line"></div>'.repeat(n)+'</div>';const shuffled=a=>a.map((v,i)=>({v,i})).sort((a,b)=>((a.i*7+3)%11)-((b.i*7+3)%11)).map(x=>x.v);const bankOrder=a=>a.slice().sort((a,b)=>a.localeCompare(b,'es'));function blank(text,words){for(const w of [...words].sort((a,b)=>b.length-a.length)){const i=text.toLocaleLowerCase('es').indexOf(w.toLocaleLowerCase('es'));if(i<0)continue;text=text.slice(0,i)+'__________'+text.slice(i+w.length)}return text}
function page(n,title,body){return '<article class="page"><div class="eyebrow">5TH YEAR SPANISH OL | LEAVING CERTIFICATE ORAL</div><h1>ROLE PLAY '+(idx+1)+' · '+esc(data[idx].title.toUpperCase())+'</h1><h2>'+n+' | '+title+'</h2>'+body+'<div class="footer">Ardgillan Community College | Spanish · '+n+'</div></article>'}
function turn(d,i){const t=d.turns[i];return '<section class="turn"><h3>Turn '+(i+1)+'</h3><p>Examiner: <strong>'+esc(t[0])+'</strong></p><p>'+esc(d.cues[i])+'</p><p class="bank">Word bank: <strong>'+esc(bankOrder(d.gaps[i]).join(' · '))+'</strong></p><p class="model">'+esc(blank(t[1].join(' '),d.gaps[i]))+'</p><p>Read aloud. Then cover the model and write your answer.</p>'+lines(3)+'</section>'}
function render(){const d=data[idx];const v=shuffled(d.vocab.map(x=>x[1]));let p1='<p>Name: _______________________ Date: ______________</p><p><strong>Learning intention:</strong> I can build the four prepared answers and practise the role-play with a partner.</p><p>'+esc(d.context)+'</p><h3>A. Watch the video</h3><p>Circle the correct answer. If the video uses different wording, listen for the same meaning.</p><ol>'+d.quiz.map(q=>'<li>'+esc(q)+'</li>').join('')+'</ol><h3>B. Match the vocabulary</h3><p>Write the correct letter beside each Spanish expression.</p><div class="vocab">'+d.vocab.map((x,i)=>'<span>'+(i+1)+'. <strong>'+esc(x[0])+'</strong> ___</span>').join('')+'</div><p>'+v.map((x,i)=>'<span>'+String.fromCharCode(65+i)+'. '+esc(x)+'</span>').join(' &nbsp; ')+'</p><h3>C. Listen again</h3><p>Tick each expression or its equivalent when you hear it.</p><div class="vocab">'+d.listen.map(x=>'<span>□ <strong>'+esc(x[0])+'</strong> ('+esc(x[1])+')</span>').join('')+'</div>';let p4='<p>Work in pairs. A is the examiner; B is the candidate. Round 1: use your completed answers. Round 2: use only the English cues. Swap roles.</p><h3>Examiner prompts — fixed order</h3>'+d.turns.map((t,i)=>'<p><strong>'+(i+1)+'. '+esc(t[0])+'</strong></p><p>'+esc(d.cues[i])+'</p>').join('')+(d.closing?'<p><strong>5. '+esc(d.closing)+'</strong></p>':'')+'<h3>Surprise question · practice example</h3><p><strong>'+esc(d.surprise)+'</strong></p><p>The actual examiner may ask a different relevant question.</p><p>Useful rescue phrase: <strong>¿Puede repetir, por favor?</strong></p><h3>Exit ticket</h3><p>Write one Spanish sentence you can now say without help.</p>'+lines(1)+'<p>□ Turn 1 &nbsp; □ Turn 2 &nbsp; □ Turn 3 &nbsp; □ Turn 4</p><p class="eyebrow">Candidate responses are practice models. Videos may use equivalent expressions.</p>';$('pages').innerHTML=page(1,'Watch and understand',p1)+page(2,'Build answers 1 and 2',turn(d,0)+turn(d,1))+page(3,'Build answers 3 and 4',turn(d,2)+turn(d,3))+page(4,'Perform the role-play',p4);update();$('back').href='role-play-challenge.html?role='+idx}
function update(){document.body.classList.toggle('project',projection);document.querySelectorAll('.page').forEach((p,i)=>p.classList.toggle('active',i===current));$('project').textContent=projection?'Show all pages':'Project / Proyectar';$('prev').hidden=$('next').hidden=$('counter').hidden=!projection;$('prev').disabled=current===0;$('next').disabled=current===3;$('counter').textContent=(current+1)+' / 4';}
data.forEach((d,i)=>{let o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+d.title;$('role').append(o)});$('role').value=idx;$('role').onchange=()=>{idx=+$('role').value;current=0;render()};$('project').onclick=()=>{projection=!projection;current=0;update();window.scrollTo(0,0)};$('prev').onclick=()=>{if(current>0)current--;update();window.scrollTo(0,0)};$('next').onclick=()=>{if(current<3)current++;update();window.scrollTo(0,0)};$('print').onclick=()=>window.print();$('download').onclick=()=>{const style=document.querySelector('style').textContent;const clone=$('pages').cloneNode(true);const doc='<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(data[idx].title)+'</title><style>'+style+'</style><body><main><p class="screen-only">To save a PDF, use your browser’s Print → Save as PDF.</p>'+clone.innerHTML+'</main></body></html>';const u=URL.createObjectURL(new Blob([doc],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='Role_Play_'+(idx+1)+'_Handout.html';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};render();
</script></body></html>
