<!doctype html><html lang="es"><meta charset="utf-8"><title>Revisión de interfaz vertical</title><style>body{margin:0;background:#070e1a;color:#eee;font:14px system-ui}header{padding:12px;display:flex;gap:8px;flex-wrap:wrap}button{padding:10px;border-radius:7px;border:1px solid #678;background:#243448;color:#fff}#screen{margin:8px 16px;position:relative}iframe{border:0;display:block;transform-origin:top left}pre{white-space:pre-wrap;padding:10px;color:#bde8d8}</style><header><button data-size="834,1110">iPad vertical</button><button data-size="1194,760">iPad horizontal</button><button data-size="390,844">Móvil vertical</button><button data-size="844,390">Móvil horizontal</button><button data-size="320,640">Móvil pequeño</button><button id="expand">Ampliación Safari (prueba CSS)</button></header><div id="screen"><iframe id="demo" title="Juego de revisión" src="/index.html?qa=1"></iframe></div><pre id="metrics"></pre><script>const frame=document.querySelector('iframe'),screen=document.querySelector('#screen');function size(w,h){const scale=Math.min(1,(innerWidth-40)/w,(innerHeight-130)/h);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+scale+')';screen.style.width=w*scale+'px';screen.style.height=h*scale+'px'}for(const b of document.querySelectorAll('[data-size]'))b.onclick=()=>size(...b.dataset.size.split(',').map(Number));document.querySelector('#expand').onclick=()=>frame.contentDocument.body.classList.toggle('expanded');size(834,1110);setInterval(()=>{try{const d=frame.contentDocument,box=id=>{const e=d.querySelector(id),r=e.getBoundingClientRect();return{top:Math.round(r.top),bottom:Math.round(r.bottom),width:Math.round(r.width),height:Math.round(r.height),visible:getComputedStyle(e).display!=='none'}},canvas=d.querySelector('#game');document.querySelector('#metrics').textContent=JSON.stringify({viewport:[frame.clientWidth,frame.clientHeight],canvasPixels:[canvas.width,canvas.height],canvas:box('#game'),hud:box('#hud'),prompt:box('#prompt'),controls:box('#touch'),message:box('#message'),overlay:box('#overlay')},null,2)}catch{}},500)</script></html>
